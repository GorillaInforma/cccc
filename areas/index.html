<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Áreas</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1d2733;--mute:#6a7786;--line:#d9e0e7;--acc:#1f5f8b;--acc2:#e3eef6;--bot:calc(62px + env(safe-area-inset-bottom,0px));--ttl:48px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:focus,:focus-visible{outline:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body.lock{overflow:hidden}
main{padding:10px;display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:calc((100vh - var(--bot) - var(--ttl) - 30px)/2);grid-auto-rows:calc((100svh - var(--bot) - var(--ttl) - 30px)/2)}
@media(max-width:599px){body{font-size:14px}main{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:calc((100vh - var(--bot) - var(--ttl) - 40px)/3);grid-auto-rows:calc((100svh - var(--bot) - var(--ttl) - 40px)/3)}}
main{padding-bottom:calc(var(--bot) + 10px)}
.area{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;min-height:0;cursor:pointer;-webkit-user-select:none;user-select:none}
.area{scroll-margin-top:10px;scroll-margin-bottom:calc(var(--bot) + 10px)}
.area.open{cursor:default;border-color:var(--acc);box-shadow:0 4px 14px rgba(31,95,139,.18)}
.area.open .l{overflow:visible}
.hd{flex:none;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
h2{font-size:1.05rem;margin:0;font-weight:650;color:var(--acc)}
.x{display:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 14px;font:inherit;cursor:pointer}
.area.open .x{display:block}
.l{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;overscroll-behavior:auto}
.item,.p{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #edf1f4}
.p{color:#33414f}
.item.first{border-top:2px solid var(--line);margin-top:6px}
.item input{margin:0;width:22px;height:22px;accent-color:#1f7a62;flex:none}
#todosT{height:var(--ttl);margin:0;padding-top:6px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:750;color:var(--ink)}
.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:650}
.p .n{background:#e0f1ec;color:#1f7a62}
.r{display:flex;align-items:center;gap:8px}
.tot{flex:none;width:30px;height:30px;padding:0;border-radius:50%;background:conic-gradient(#1f7a62 0 var(--p,0%),var(--acc) 0);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:650}
.t{flex:1;min-width:0;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px}
.item input:checked~.t{color:var(--mute);text-decoration:line-through}
.item,.p{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#hoyV{display:none;padding:12px 10px calc(var(--bot) + 16px)}
.col{min-width:0}
#hoyV h2,#histV h2{font-size:1.8rem;line-height:1.1;margin:0;color:var(--ink);font-weight:750}
#hoyH{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin:6px 4px 12px}
#hoyD{color:var(--mute);font-size:.85rem;margin-top:2px;text-transform:capitalize}
#hoyP{font-weight:750;color:#1f7a62;font-size:1rem;display:none}
#bar{height:7px;border-radius:4px;background:#dcefe8;margin:0 4px 6px;overflow:hidden;display:none}
#barI{display:block;height:100%;width:0;background:#1f7a62;border-radius:4px;transition:width .3s}
#hoyL:not(:empty){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px;align-items:start;padding:0 2px}
#hoyL h3{padding-left:2px;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--acc);font-weight:700;margin:18px 0 2px}
#hoyL .item,#hoyL .p{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;box-shadow:0 1px 2px rgba(29,39,51,.05)}
#hoyL .item input{accent-color:#1f7a62}
#hoyE{display:none;text-align:center;color:var(--mute);padding:56px 28px}
#hoyE svg{display:block;margin:0 auto 12px;opacity:.5}
#hoyE b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;height:var(--bot);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);display:flex}
#nav button{flex:1;position:relative;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
#nav button.on{color:var(--acc)}
.bdg{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center}
#histV{display:none;padding:12px 10px calc(var(--bot) + 16px)}
#histV h2{text-align:center;margin:6px 0 12px}
.hc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;box-shadow:0 1px 2px rgba(29,39,51,.05)}
.hch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.hch span:first-child{font-weight:650;text-transform:capitalize}
.hpill{background:#e0f1ec;color:#1f7a62;font-size:12px;font-weight:700;border-radius:12px;padding:3px 10px}
.hi{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid #edf1f4;font-size:.92rem}
.hi .dt{flex:none;width:18px;text-align:center;color:var(--mute);font-weight:700}
.hi.dn .dt{color:#1f7a62}
.hi.dn span{color:var(--mute)}
#histE{display:none;text-align:center;color:var(--mute);padding:56px 28px}
#histE svg{display:block;margin:0 auto 12px;opacity:.5}
#histE b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:calc(var(--bot) + 12px);transform:translateX(-50%);background:#1d2733;color:#fff;padding:8px 16px;border-radius:18px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
</style>

<style id="fx3d">

body{background:#fff}
.area{background:#fff;
 border:1px solid #edf2f8;border-radius:20px;
 transition:transform .2s ease,box-shadow .2s ease;

<style id="fxverde">
#hoyL .item.dn,#hoyL .p.dn{background:#e8f7f1;border-color:#bfe5d6;
 box-shadow:0 1px 0 #fff inset,0 2px 4px rgba(31,122,98,.10),0 10px 20px -4px rgba(31,122,98,.22),0 22px 34px -16px rgba(31,122,98,.28)}
#hoyL .p.dn .t{color:#1f6b55}
#hoyL .p{cursor:pointer}
</style>

<style id="fxhist">
.hc{cursor:pointer;-webkit-user-select:none;user-select:none}
.hc{display:flex;flex-direction:column;min-height:70px}
.hc:not(.open){justify-content:center}
.hc .hch{margin-bottom:0}
.hc.open .hch{margin-bottom:4px}
.hc .hi{display:none}
.hc.open .hi{display:flex}
</style>

<style id="fxlp">
@keyframes lpfill{from{background-size:0% 100%}to{background-size:100% 100%}}
.item.lp,.p.lp{background-image:linear-gradient(90deg,rgba(55,165,138,.38),rgba(55,165,138,.38));background-repeat:no-repeat;background-position:left center;background-size:0% 100%;animation:lpfill 1.28s linear forwards}
.item.lp.rm,.p.lp.rm{background-image:linear-gradient(90deg,rgba(120,140,170,.32),rgba(120,140,170,.32))}
#bigok,#bigsm{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:40;opacity:0}
#bigok.show,#bigsm.show{animation:okfade 1.1s ease forwards}
#bigok svg,#bigsm svg{filter:drop-shadow(0 14px 24px rgba(31,122,98,.4))}
#bigok.show svg,#bigsm.show svg{animation:okpop .5s cubic-bezier(.2,1.4,.4,1)}
#bigok path,#bigsm path{stroke-dasharray:90;stroke-dashoffset:90}
#bigsm svg{filter:drop-shadow(0 14px 24px rgba(31,95,139,.4))}
#bigok.show path,#bigsm.show path{animation:okdraw .45s .15s ease forwards}
@keyframes okfade{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes okpop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes okdraw{to{stroke-dashoffset:0}}
/* en Hoy las tarjetas tenían fondo con más prioridad y tapaban el relleno */
#hoyL .item.lp,#hoyL .p.lp{background-image:linear-gradient(90deg,rgba(55,165,138,.42),rgba(55,165,138,.42));background-repeat:no-repeat;background-position:left center;background-size:0% 100%;animation:lpfill 1.28s linear forwards}
#hoyL .item.lp.rm,#hoyL .p.lp.rm{background-image:linear-gradient(90deg,rgba(110,135,170,.40),rgba(110,135,170,.40))}
/* si presionas en el lado izquierdo, rellena desde la derecha (y viceversa) */
.item.lp.fr,.p.lp.fr,#hoyL .item.lp.fr,#hoyL .p.lp.fr{background-position:right center}
@media(prefers-reduced-motion:reduce){.item.lp,.p.lp{animation-duration:1.5s}}
</style>

<style id="fxhi">
.hc .hi{padding:8px 6px;border-radius:10px;cursor:pointer;touch-action:pan-y;-webkit-user-select:none;user-select:none;position:relative}
.hc .hi .dt{width:22px}
.hc .hi.sw{z-index:1;border-top-color:transparent;background:#e0212f;color:#fff;box-shadow:0 6px 14px -4px rgba(224,33,47,.55)}
.hc .hi.sw span,.hc .hi.sw .dt,.hc .hi.sw.dn span,.hc .hi.sw.dn .dt{color:#fff}
</style>
</head>

<section id="hoyV"><div id="hoyH"><div><h2>Hoy</h2><div id="hoyD"></div></div><div id="hoyP"></div></div><div id="bar"><i id="barI"></i></div><div id="hoyL"></div><div id="hoyE"><svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg><b>Aún no hay nada para hoy</b>Mantén presionado un punto en las tarjetas para agregarlo aquí.</div></section>

<nav id="nav"><button type="button" class="on" data-v="todos"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Todos</button><button type="button" data-v="hoy"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>Hoy<span class="bdg" id="hoyN">0</span></button><button type="button" data-v="hist"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</button></nav>

<script>
/* almacenamiento en memoria; la fuente de verdad es Firestore */
var ST={d:{},getItem:function(k){return Object.prototype.hasOwnProperty.call(this.d,k)?this.d[k]:null},setItem:function(k,v){this.d[k]=String(v);if(window.cloudDirty)window.cloudDirty()},removeItem:function(k){delete this.d[k];if(window.cloudDirty)window.cloudDirty()}};
/* [area, con casilla, sin casilla] */
var A=[
["General",
 ["Lavar","Recoger","Madrugar ya"],
 ["Enfocarme en mí ya, no perder el tiempo","Construirme para mí","Usar herramientas ya existentes"]],
["Escuela",
 ["Estudiar","Hacer tareas","Ejercicios","Repasar","Pasar","Uni"],[]],
["Trabajo dinero",
 ["Trabajar","Hacer varo","Negocio","Haber busca otro jaja","Podcast","Tiktok"],
 ["Que el trabajo tranquilo, tú mantenlo en lo que consigues otro jaja"]],
["Por conseguir",
 ["Coche","Carro","Licencia","Alquilar coche","Autolavado","Iphone","Edredón","Base cama","Ropero","Cristalizar cuadro","Muebles","Casa muebles chidos"],[]],
["Ejercicio y deporte",
 ["Hacer ejercicio","Deporte","Gym","Bíceps y tríceps"],[]],
["Social",
 ["Fingir que no tengo amigos, construir nuevos","Toqueteos","Compi","Hablarle a la gente tranquilo","Personas, persona compas","Salidas social pedas etc","Salir a echar desmadre","Cigarros cheves","Divertirme","Desmadre","Enamorarme","Salir y socializar","Coger"],
 ["Recuestionarme mi sociabilidad","El hecho de no ser invitado a fiestas","Quizás no formar a ser amable y caer bien sino realmente serlo","Que se note","No ser mala onda","Ser muy amable y amigable","No ponerme nervioso cuando hablo con alguien","Sociabilidad","Amable buena onda este busca una amistad tener algo que nos divierta jajaja"]],
["Actitud",
 [],
 ["Actitud","Ánimo","Huevos","Sin estrés","Sin pena","Aventado","Rápido","Hacerlo rápido sin pensar tanto solo hacerlo","No ser amargado ni enojado","No ser enojón","Ser tranki y humilde","Que los problemas no me impongan","Disfrutar mi juventud","Ser feliz con todas las cosas","Deje atrás a una persona que no lucha, floja y conformista","Dejar de obsesionarme con cosas pendejas","No ser friki","Ser auténtico"]],
["Imagen",
 ["Gorra","Tatuajes","Pelo","Ropa","Tenis","Perfume","Accesorios","Barba","Lentes","Dientes"],
 ["Carita fina","Musculitos","Seguridad","Alto delgado","Vestir chido"]],
["Lo que me atrae",
 [],
 ["Gorra","Tatuajes","Carita fina","Musculitos","Seguridad","Delgaditos del c","Hombrudos","Pelos barba etc","Bíceps y tríceps","Caritas chiquitas","El culoncito","Lentes altos combinados","Sudadera","Que tiene compas más grandes que aparenta más edad","Que hay mucho toqueteo mucha química","Que se juntan y pueden convivir tranqui","Además también estaban guapos todos"]]
];
var KEY="areas-v3",HK="areas-hoy2",S={},UID=[],AREA=[],BY={},KEYS={};
try{S=JSON.parse(ST.getItem(KEY)||"{}")}catch(e){S={}}
function saveS(){try{ST.setItem(KEY,JSON.stringify(S))}catch(x){}}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function num(n){return '<div class="n">'+n+'</div>'}
function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
var PK="areas-pdone";
function getPD(){try{var o=JSON.parse(ST.getItem(PK)||"{}");if(o.d===today()&&Array.isArray(o.k))return o.k}catch(e){}return []}
function setPD(k){try{ST.setItem(PK,JSON.stringify({d:today(),k:k}))}catch(x){}}
function getPicks(){
 try{var o=JSON.parse(ST.getItem(HK)||"{}");if(o.d===today()&&Array.isArray(o.p))return o.p.filter(function(k){return KEYS[k]===1})}catch(e){}
 return []}
function setPicks(p){try{ST.setItem(HK,JSON.stringify({d:today(),p:p}))}catch(x){}}
function row(t,n,first,k){
 var u=BY[t];
 return '<div class="item'+(first?" first":"")+(S[t]?" dn":"")+'" data-k="'+k+'">'+num(n)+'<input type="checkbox" data-u="'+u+'"'+(S[t]?" checked":"")+'><span class="t">'+esc(t)+'</span></div>'}
var h="";
A.forEach(function(a,ai){a[1].forEach(function(t,j){BY[t]=UID.length;UID.push(t);AREA.push(a[0]);KEYS["c"+ai+"_"+j]=1});a[2].forEach(function(t,j){KEYS["p"+ai+"_"+j]=1})});
A.forEach(function(a,ai){
 var N=a[1].length+a[2].length,n=0;
 h+='<section class="area"><div class="hd"><h2>'+a[0]+'</h2><div class="r"><span class="tot">'+N+'</span></div></div><div class="l">';
 a[2].forEach(function(t,j){n++;h+='<div class="p" data-k="p'+ai+'_'+j+'">'+num(n)+'<span class="t">'+esc(t)+'</span></div>'});
 a[1].forEach(function(t,j){n++;h+=row(t,n,j===0&&a[2].length,"c"+ai+"_"+j)});
 h+='</div></section>'});
var m=document.getElementById("m");
m.innerHTML=h;
function fit(root){
 var base=root.classList&&root.classList.contains("open")?17:(window.innerWidth<600?13:14),MIN=10;
 function ok(el){return el.scrollHeight<=el.clientHeight+1}
 root.querySelectorAll(".t").forEach(function(el){
  if(el.closest(".area.open")){el.style.webkitLineClamp="none";el.style.fontSize="15px";return}
  var done=false;
  [1,2,3].forEach(function(n){
   if(done)return;
   el.style.webkitLineClamp=n;
   for(var z=base;z>=MIN;z-=0.5){
    el.style.fontSize=z+"px";
    if(ok(el)){done=true;return}}});
  if(!done){el.style.webkitLineClamp=3;el.style.fontSize=MIN+"px"}})}
var view="todos",tT=null;
function toast(t){var e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(tT);tT=setTimeout(function(){e.classList.remove("show")},1400)}
function updProg(){
 var p=getPicks(),tot=0,ok=0;
 A.forEach(function(a,ai){a[1].forEach(function(t,j){if(p.indexOf("c"+ai+"_"+j)>=0){tot++;if(S[t])ok++}})});
 var P=document.getElementById("hoyP"),B=document.getElementById("bar");
 P.style.display=B.style.display=tot?"block":"none";
 P.textContent=ok+" de "+tot;
 document.getElementById("barI").style.width=(tot?ok/tot*100:0)+"%"}
function renderHoy(){
 var p=getPicks(),pd=getPD(),sc="",sp="",nc=0,np=0;
 A.forEach(function(a,ai){
  var rp="",rc="";
  a[2].forEach(function(t,j){var k="p"+ai+"_"+j;if(p.indexOf(k)>=0){np++;rp+='<div class="p'+(pd.indexOf(k)>=0?" dn":"")+'" data-k="'+k+'">'+num(np)+'<span class="t">'+esc(t)+'</span></div>'}});
  a[1].forEach(function(t,j){var k="c"+ai+"_"+j;if(p.indexOf(k)>=0){nc++;rc+=row(t,nc,false,k)}});

 var H=getH(),p=getPicks(),d=[];
 A.forEach(function(a,ai){a[1].forEach(function(t,j){var k="c"+ai+"_"+j;if(p.indexOf(k)>=0&&S[t])d.push(k)})});

   a[2].forEach(function(t,j){var k="p"+ai+"_"+j;if(o.p.indexOf(k)>=0)rows+=hiRow(k,t,pd.indexOf(k)>=0)});
   a[1].forEach(function(t,j){var k="c"+ai+"_"+j;if(o.p.indexOf(k)>=0){tot++;var dn=o.d.indexOf(k)>=0;if(dn)ok++;rows+=hiRow(k,t,dn)}})});
  var dt=new Date(day+"T12:00:00").toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});
  s+='<div class="hc" data-day="'+day+'"><div class="hch"><span>'+dt+'</span>'+(tot?'<span class="hpill">'+ok+' de '+tot+'</span>':'')+'</div>'+rows+'</div>'});

 if(!tot)pl.remove();else pl.textContent=ok+" de "+tot}

  if(td){var d=getPD(),i2=d.indexOf(k);if(on&&i2<0)d.push(k);if(!on&&i2>=0)d.splice(i2,1);setPD(d);saveHist();renderHoy()}

var openY=null;
function openCard(c){
 if(cur&&cur!==c)closeCard();
 m.querySelectorAll(".area.open").forEach(function(x){if(x!==c)x.classList.remove("open")});
 var rowH=c.offsetHeight,gap=10,cards=[].slice.call(m.children),
 cols=Math.max(1,getComputedStyle(m).gridTemplateColumns.split(" ").length),
 ci=cards.indexOf(c),cc=ci%cols,cr=Math.floor(ci/cols);

 cur=c;c.classList.add("open");fit(c);
 var l=c.querySelector(".l"),need=c.querySelector(".hd").offsetHeight+4+l.scrollHeight+24,
 n=Math.max(1,Math.ceil((need+gap)/(rowH+gap)));
 /* cada tarjeta conserva su columna (izq/der); la abierta crece hacia abajo en la suya */
 var place={},byCol=[],gEnd=0,k;
 for(k=0;k<cols;k++)byCol.push([]);
 cards.forEach(function(x,i){
  var col=i%cols,rw=Math.floor(i/cols);
  if(col===cc&&rw>cr)rw+=n-1;
  var p={x:x,i:i,c:col,r:rw,sp:i===ci?n:1};
  place[i]=p;byCol[col].push(p);gEnd=Math.max(gEnd,p.r+p.sp)});
 /* si una columna queda más corta, se reparte el sobrante entre sus tarjetas de abajo */
 byCol.forEach(function(list,k){
  list.sort(function(a,b){return a.r-b.r});
  if(!list.length)return;
  var last=list[list.length-1],extra=gEnd-(last.r+last.sp),
  st=list.filter(function(p){return p.i!==ci&&(k===cc?p.r>cr:p.r>=cr)});
  if(extra>0){
   if(!st.length)st=[last];
   st.forEach(function(p,j){p.sp+=Math.floor(extra/st.length)+(j<extra%st.length?1:0)});
   var ptr=0;list.forEach(function(p){p.r=ptr;ptr+=p.sp})}});
 cards.forEach(function(x,i){var p=place[i];x.style.gridColumn=String(p.c+1);x.style.gridRow=(p.r+1)+" / span "+p.sp});
 l.scrollTop=0;try{c.scrollIntoView({block:"start"})}catch(x){window.scrollTo(0,c.getBoundingClientRect().top+window.scrollY-10)}
 openY=null;setTimeout(function(){if(cur===c)openY=window.scrollY},120)}

var lpT=null,lpX=0,lpY=0,lpF=false,lastTouch=0,lpEl=null,lpPre=null;

  else return}

 sw.el.style.transform="translateX("+dx+"px)"});
